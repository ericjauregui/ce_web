
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}California Earrings — Wholesale 14K Gold Earrings{% endblock %}</title>
  <meta name="description" content="Manufacturers & wholesalers of 14K gold earrings in Los Angeles.">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-black text-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-gold fixed-top">
  <div class="container">
    <a class="navbar-brand brand" href="/">California Earrings</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div id="nav" class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
        <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
<main class="mt-5 pt-4">{% block content %}{% endblock %}</main>
<footer class="text-center py-4 border-top border-gold mt-5 text-gold-70">
  © {{ 2025 }} California Earrings · Wholesale Only · Los Angeles
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
