<div class="col">
  {% set drawer_id = 'drawer-' ~ p.code|lower|replace(' ', '-')|replace('/', '-') %}
  <article class="card product product-card shadow-sm bg-dark border-0"
       role="button"
       tabindex="0"
      data-detail-url="{{ url_for('product_detail', product_code=p.code) }}"
       aria-expanded="false"
       aria-controls="{{ drawer_id }}">
    <div class="product-img-wrap">
      <img class="card-img-top product-img" src="{{ url_for('static', filename='product_images/' ~ p.image) }}"
        alt="{{ p.name }}" loading="lazy" decoding="async" fetchpriority="low">
    </div>
    <div class="card-body text-center d-flex flex-column">
      <a class="small code-badge product-detail-link" href="{{ url_for('product_detail', product_code=p.code) }}"
        aria-label="View details for {{ p.name }} {{ p.code }}">
        {{ p.code }}
      </a>
<div id="{{ drawer_id }}" class="product-drawer" aria-hidden="true">
  <p class="card-text text-gold-70 mb-0">{{ p.name }}</p>
  <p class="card-text text-gold-70 small mb-0">*CZs available in all birthstones.</p>
  <p class="card-text text-gold-70 small mb-0">*Contact us for wholesale pricing.</p>
</div>

      <div class="product-actions mt-auto pt-2 d-grid gap-2">
        <button type="button"
                class="btn btn-outline-gold btn-sm rounded-pill add-to-cart-btn"
                data-code="{{ p.code }}">
          Add to Order
        </button>
        <div class="product-qty-control d-none" data-code="{{ p.code }}" aria-label="Inline quantity controls">
          <button type="button" class="btn btn-outline-gold btn-sm rounded-pill qty-clear-btn"
            aria-label="Clear item from cart">×</button>
          <div class="qty-center-group" aria-hidden="false">
            <button type="button" class="btn btn-outline-gold btn-sm rounded-pill qty-adjust-btn" data-delta="-1"
              aria-label="Decrease quantity">−</button>
            <input type="number" min="0" max="999" step="1" inputmode="numeric" class="product-qty-pill product-qty-input"
              value="1" aria-label="Quantity" />
            <button type="button" class="btn btn-outline-gold btn-sm rounded-pill qty-adjust-btn" data-delta="1"
              aria-label="Increase quantity">+</button>
          </div>
          </div>
          </div>
    </div>
    </article>
</div>
