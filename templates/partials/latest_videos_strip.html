<section class="latest-videos-section pb-3" aria-label="Product Reels">
  <div class="{% if request.endpoint == 'index' %}home-reels-heading{% else %}sticky-section-header{% endif %} border-top border-bottom border-gold mb-3">
    <div class="container section-header-row py-3">
      <div>
      <h2 class="m-0 section-title catalog-section-title">
        <span class="catalog-section-title-text">Product Reels</span>
        <span class="catalog-section-title-rule" aria-hidden="true"></span>
      </h2>
      {% if request.endpoint == 'index' %}<p class="home-row-subtitle">Discover our jewelry in motion</p>{% endif %}
      </div>
      <div class="section-header-cats" aria-hidden="true"></div>
      <div class="section-header-jump d-flex gap-3 align-items-center">
        <a class="{% if reels_view_all_button|default(false) %}btn btn-outline-gold reels-view-all-btn{% elif request.endpoint == 'index' %}home-row-button{% else %}chip catalog-row-action{% endif %}"
          href="{{ url_for('reels_page') }}">View All</a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="latest-videos-shell scroll-cue-shell scroll-cue-shell--reels">
      <div
        class="latest-videos-track inline-reel-track scroll-cue-track"
        id="latestVideosTrack"
        role="list"
        aria-label="Latest video previews"
      >
        {% for reel in latest_reels %}
        <article
          class="latest-video-card inline-reel-card"
          data-reel-url="{{ reel.url }}"
          tabindex="0"
          role="button"
          aria-expanded="false"
          aria-label="Play video {{ loop.index }}"
        >
          <div class="latest-video-card__media inline-reel-media">
            <video
              class="latest-video-preview inline-reel-video"
              {% if reel.poster %}data-poster="{{ asset_url(reel.poster) }}"{% endif %}
              {% if reel.poster_160 %}data-poster-small="{{ asset_url(reel.poster_160) }}"{% endif %}
              {% if reel.poster_320 %}data-poster-medium="{{ asset_url(reel.poster_320) }}"{% endif %}
              data-src="{{ reel.url }}"
              muted
              loop
              playsinline
              preload="none"
            ></video>
            <div
              class="latest-video-placeholder inline-reel-placeholder"
              aria-hidden="true"
            ></div>
          </div>
        </article>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
