            {% for row in items %}
            <tr>
              <td class="cell-item" data-label="Item">
                <div class="d-flex align-items-center">
                  <a class="cart-product-link cart-product-thumb-link" href="{{ url_for('product_detail', product_code=row.product.code) }}" aria-label="View {{ row.product.code }} product details">
                    <img src="{{ asset_url('product_images/' ~ row.product.image) }}" {{ product_image_attributes('product_images/' ~ row.product.image, 'cart')|xmlattr }} class="cart-thumb" alt="" loading="lazy" decoding="async" width="56" height="56">
                  </a>
                </div>
              </td>
              <td class="cell-code" data-label="Code"><a class="code-badge cart-product-link cart-product-code-link" href="{{ url_for('product_detail', product_code=row.product.code) }}">{{ row.product.code }}</a></td>
              <td class="cell-qty" data-label="Quantity">
                <div class="qty-control" data-code="{{ row.product.code }}" data-qty="{{ row.qty }}">
                  <button class="btn btn-outline-gold qty-adjust-btn qty-minus" type="button" aria-label="Decrease quantity for {{ row.product.code }}">−</button>
                  <input class="form-control bg-black text-light border-gold qty-input product-qty-input" value="{{ row.qty }}" inputmode="numeric" type="number" min="0" max="999" step="1" aria-label="Quantity for {{ row.product.code }}">
                  <button class="btn btn-outline-gold qty-adjust-btn qty-plus" type="button" aria-label="Increase quantity for {{ row.product.code }}">+</button>
                </div>
              </td>
              <td class="cell-notes" data-label="Item Notes">
                <div class="item-note-shell is-collapsed" data-compact-label="Note">
                  <textarea class="form-control form-control-sm bg-black text-light border-gold item-note-input"
                    data-code="{{ row.product.code }}" rows="1" maxlength="500"
                    placeholder="Note for this item (optional)" aria-label="Item Notes for {{ row.product.code }}">{{ row.note }}</textarea>
                </div>
                </td>
                <td class="cell-remove" data-label="">
                <button class="btn btn-outline-gold qty-remove" aria-label="Remove {{ row.product.code }} from order" type="button" data-code="{{ row.product.code }}"><span class="cart-remove-text" aria-hidden="true">Remove</span><span class="cart-remove-icon" aria-hidden="true">×</span></button>
              </td>
            </tr>
            {% endfor %}
