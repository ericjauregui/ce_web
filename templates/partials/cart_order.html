  <div class="mt-3 card bg-dark border-gold p-3" id="cartContentCard">
    <div class="cart-order-scroll">
      <div id="cartEmptyState" class="cart-empty-state" {% if items %}hidden{% endif %}>
        <p class="text-gold-70 mb-0 cart-empty-message">Your showcase is waiting. Browse the catalog and start building your next order.</p>
      </div>
      <div class="table-responsive" id="cartTableWrap" {% if not items %}hidden{% endif %}>
        <table class="table table-dark align-middle mb-0 minimal-items-table cart-items-table">
          <thead>
            <tr>
              <th class="cart-col-item">Item</th>
              <th class="cart-col-code">Code</th>
              <th class="cart-col-qty">Quantity</th>
              <th class="cart-col-notes">Item Notes</th>
              <th class="cart-col-remove"></th>
            </tr>
          </thead>
          <tbody id="cartTableBody">
            {% include 'partials/cart_rows.html' %}
          </tbody>
        </table>
      </div>

    </div>
      <div id="cartUndoClear"></div>
      <div class="cart-summary-bar mt-3" id="cartSummaryBar" {% if not items %}hidden{% endif %}>
        <div class="cart-summary-bar__left">
          <button type="button" class="btn btn-outline-gold" id="clearOrderBtn">Clear Order</button>
        </div>
        <div class="cart-summary-bar__center">
          <div class="d-flex align-items-center flex-wrap gap-2 cart-summary-metrics">
            <div class="text-gold-70 small">Styles:<span id="cartLineItemCount">{{ items|length }}</span></div>
            <div class="text-gold-70 small">Total Quantity:<span id="cartTotalQty">{{ total_items }}</span></div>
          </div>
        </div>
        <div class="cart-summary-bar__right">
          <a class="btn btn-outline-gold cart-checkout-btn summary-submit-btn--highlight" href="{{ url_for('checkout') }}">Checkout</a>
        </div>
      </div>
  </div>
