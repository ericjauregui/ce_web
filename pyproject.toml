[project]
name = "ce_web"
version = "0.1.0"
description = "California Earrings Flask catalog web app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.2",
    "gunicorn==23.0.0",
    "python-dotenv==1.2.1",
    "reportlab>=4.2.0,<5",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.58,<2",
    "pre-commit>=4.0,<5",
]
