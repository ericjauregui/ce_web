<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>{% block title %}California Earrings | 14K Gold Wholesaler of Earrings{% endblock %}</title>
  <meta name="description"
    content="{% block meta_description %}Los Angeles based manufacturer & wholesaler of 14K gold earrings.{% endblock %}">

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <script defer data-domain="{{ plausible_domain }}" src="https://plausible.io/js/script.js"></script>

</head>
<body class="bg-black text-light">
<div class="page-shell">
  <nav class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-gold fixed-top">
    <div class="container">
      <a href="{{ url_for('index') }}" class="navbar-brand brand-lockup" aria-label="{{ site_name }}">
        <img src="{{ url_for('static', filename='assets/ce_logo_full.png') }}" alt="{{ site_name }}" class="brand-logo"
          loading="eager" decoding="async" />
      </a>
      <a class="nav-link position-relative text-gold-70 ms-auto me-2 order-lg-2" href="/cart" aria-label="Cart">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCountBadge"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-dark border border-gold"
          style="display:none;">0</span>
      </a>
      <button class="navbar-toggler order-lg-3" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav"
        aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div id="nav" class="collapse navbar-collapse order-lg-1">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/team">Meet the team</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
          </ul>
          </div>
          </div>
          </nav>

  <main class="mt-5 pt-4">{% block content %}{% endblock %}</main>

  <footer class="text-center py-4 border-top border-gold mt-5 text-gold-70">
    © {{ 2026 }} California Earrings · Wholesalers · Los Angeles, CA, USA
    <div class="footer-social mt-2">
      <span class="text-gold-70">Follow us on our socials: </span>
      <a class="text-gold-70 text-decoration-none" href="{{ social.instagram.profile_url }}" target="_blank"
        rel="noopener">Instagram</a>
      <span class="text-gold-70"> · </span>
      <a class="text-gold-70 text-decoration-none" href="{{ social.tiktok.profile_url }}" target="_blank"
        rel="noopener">TikTok</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block body_end %}{% endblock %}
  <script>
                  async function refreshCartCount() {
                    try {
                      const data = await fetch("/api/cart/count").then(r => r.json());
                      const badge = document.getElementById("cartCountBadge");
                    if (badge) {
                      badge.textContent = data.total_items || 0;
                      badge.style.display = (data.total_items || 0) > 0 ? "inline-block" : "none";
                    }
                                  } catch (e) { }
                                }
                                document.addEventListener("DOMContentLoaded", refreshCartCount);
                              </script>
</div>
</body>
</html>
