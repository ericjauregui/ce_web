<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>{% block title %}California Earrings | 14K Gold Wholesaler of Earrings{% endblock %}</title>
  <meta name="description"
    content="{% block meta_description %}Los Angeles based manufacturer & wholesaler of 14K gold earrings.{% endblock %}">

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

  <script defer data-domain="{{ plausible_domain }}" src="https://plausible.io/js/script.js"></script>

</head>
<body class="bg-black text-light" id="top">
<div class="page-shell">
  <nav class="navbar navbar-dark bg-black border-bottom border-gold fixed-top">
    <div class="container position-relative">
      <a href="{{ url_for('index') }}" class="navbar-brand brand-lockup" aria-label="{{ site_name }}">
        <img src="{{ url_for('static', filename='assets/ce_logo_full.png') }}" alt="{{ site_name }}" class="brand-logo"
          loading="eager" decoding="async" />
      </a>
{% set current_q = request.args.get('q', '') %}
<div class="nav-search nav-search-center">
  <button type="button" class="nav-search-trigger" aria-controls="navSearchForm"
    aria-expanded="false">
    <svg class="nav-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-3.5-3.5"></path>
    </svg>
    <span class="nav-search-label">Search our products</span>
  </button>

  <form id="navSearchForm" class="nav-search-form" action="{{ url_for('index') }}" method="get" role="search">
    <input class="form-control nav-search-input border-gold" type="search" name="q" placeholder="Search our products"
      value="{{ current_q }}" autocomplete="off" />
  </form>
</div>

<div class="nav-actions ms-auto d-flex align-items-center">
  <a id="cartLink" class="nav-link cart-link position-relative text-gold-70 me-2 ms-2" href="/cart" aria-label="Cart" {%
    if request.path=='/cart' %}aria-current="page" {% endif %}>
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCountBadge"
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-dark border border-gold"
          style="display:none;">0</span>
      </a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false"
  aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
</div>

      <div id="nav" class="collapse navbar-collapse w-100 text-end">
        <ul class="navbar-nav ms-auto align-items-end text-end">
          <li class="nav-item"><a class="nav-link" href="/team">Meet the team</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact Us</a></li>
          </ul>
          </div>
          </div>
          </nav>

  <main class="mt-5 pt-4">{% block content %}{% endblock %}</main>

  <footer class="text-center py-4 border-top border-gold mt-5 text-gold-70">
    © {{ 2026 }} California Earrings · Wholesalers · Los Angeles, CA, USA
    <div class="footer-social mt-2">
      <span class="text-gold-70">Follow us on our socials: </span>
      <a class="text-gold-70 text-decoration-none" href="{{ social.instagram.profile_url }}" target="_blank"
        rel="noopener">Instagram</a>
      <span class="text-gold-70"> · </span>
      <a class="text-gold-70 text-decoration-none" href="{{ social.tiktok.profile_url }}" target="_blank"
        rel="noopener">TikTok</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block body_end %}{% endblock %}
  <script>
                  async function refreshCartCount() {
                    try {
                      const data = await fetch("/api/cart/count").then(r => r.json());
                      const badge = document.getElementById("cartCountBadge");
                    if (badge) {
                      badge.textContent = data.total_items || 0;
                      badge.style.display = (data.total_items || 0) > 0 ? "inline-block" : "none";
                    }
                                  } catch (e) { }
                                }
                                document.addEventListener("DOMContentLoaded", refreshCartCount);
                                  // Bounce cart when selected/activated (click, Enter, Space)
                                  (function () {
                                    const el = document.getElementById("cartLink");
                                    if (!el) return;

                                    function bounce() {
                                      el.classList.remove("is-bouncing");
                                      void el.offsetWidth; // reflow to retrigger animation
                                      el.classList.add("is-bouncing");
                                      window.setTimeout(() => el.classList.remove("is-bouncing"), 650);
                                    }

                                    el.addEventListener("click", bounce);
                                    el.addEventListener("keydown", (e) => {
                                      if (e.key === "Enter" || e.key === " ") bounce();
                                    });
                                  })();

  // Expandable navbar search
  (function () {
    const wrap = document.querySelector(".nav-search");
    if (!wrap) return;

    const btn = wrap.querySelector(".nav-search-trigger");
    const input = wrap.querySelector(".nav-search-input");
    const initialValue = input ? input.value : "";

    function resetInputValue() {
      if (!input) return;
      input.value = initialValue;
    }

    function setOpen(open, options = {}) {
      const { restoreValue = false } = options;
      wrap.classList.toggle("is-open", open);
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      if (open) {
        window.setTimeout(() => {
          if (!input) return;
          input.focus();
          if (input.value) input.select();
        }, 0);
        return;
      }

      if (restoreValue) resetInputValue();
    }

    btn.addEventListener("click", () => {
      const open = !wrap.classList.contains("is-open");
      setOpen(open, { restoreValue: !open });
    });

    if (input) {
      input.addEventListener("keydown", (e) => {
        const isSelectAll = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "a";
        if (!isSelectAll) return;
        e.preventDefault();
        input.select();
      });
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && wrap.classList.contains("is-open")) {
        setOpen(false, { restoreValue: true });
        btn.focus();
      }
    });

    document.addEventListener("click", (e) => {
      if (!wrap.contains(e.target) && wrap.classList.contains("is-open")) {
        setOpen(false, { restoreValue: true });
      }
    });
  })();
</script>
</div>
</body>
</html>
